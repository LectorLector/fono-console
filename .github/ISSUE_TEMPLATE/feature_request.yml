name: "Feature request / 功能建議"
description: "Suggest an idea or an improvement. / 提出想法或改進。"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [roadmap](https://github.com/LectorLector/fono-console/blob/main/ROADMAP.md) first, and use Discussions if you just want to talk an idea through.

        請先看看[發展路線](https://github.com/LectorLector/fono-console/blob/main/ROADMAP.md)；只想聊聊想法的話，請到 Discussions。
  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve? / 想解決什麼問題？"
      description: "Describe what you are trying to do and what gets in the way. / 描述你想做的事，以及卡在哪裡。"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "What would you like to see? / 你希望看到什麼？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you tried / 你試過的其他做法"
      description: "Other tools (REW, Equalizer APO by hand …) or workarounds. / 其他工具或變通方法。"
  - type: dropdown
    id: help
    attributes:
      label: "Can you help? / 你能幫忙嗎？"
      options:
        - "I can test it / 我可以測試"
        - "I can send a pull request / 我可以送 PR"
        - "Just an idea / 只是想法"
    validations:
      required: true
